[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextlens"
version = "0.1.0"
description = "An on-demand conversation assistant."
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "langgraph", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "opentelemetry-api", "opentelemetry-sdk", "prometheus-client", "ruff", "scikit-learn", "fastapi", "httpx", "uvicorn", "jsonschema", "psutil", "pyyaml", "websockets"]
server = ["fastapi", "uvicorn", "websockets"]
postgres = ["psycopg[binary]", "pgvector"]
rerank = ["sentence-transformers"]
speech = ["grpcio", "grpcio-tools"]
diarize = ["pyannote.audio==4.0.7"]
train = ["torch", "transformers", "mlflow-skinny", "tiktoken", "sentencepiece", "peft", "accelerate", "bitsandbytes"]
obs = ["opentelemetry-api", "opentelemetry-sdk", "prometheus-client"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not real'"
markers = [
  "real: needs a GPU, Ollama, or a network; runs only when a task asks for it",
  "gpu: needs the GPU service and a GPU turn; runs only when -m names gpu",
]

[tool.ruff]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
