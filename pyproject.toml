[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextlens"
version = "0.1.0"
description = "An on-demand conversation assistant."
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "scikit-learn"]
postgres = ["psycopg[binary]", "pgvector"]
rerank = ["sentence-transformers"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not real'"
markers = ["real: needs a GPU, Ollama, or a network; runs only when a task asks for it"]

[tool.ruff]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
