services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contextlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contextlens}
      POSTGRES_DB: ${POSTGRES_DB:-contextlens}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
